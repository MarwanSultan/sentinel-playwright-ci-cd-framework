default_stages: [pre-commit]
fail_fast: false

repos:
  # 1. Standard Best Practice Hooks (Formatting & Safety)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json

  # 2. Industry Best Practice: Custom Regex Guard for Emojis
  - repo: local
    hooks:
      - id: block-emojis
        name: Block emojis in staged code
        entry: 'Emoji detection failed: Remove emojis from code or comments before committing.'
        language: fail
        # Matches Unicode Extended Pictographics in staged files
        files: '\.(js|ts|jsx|tsx|py|java|go|sh|yaml|json|md)$'
        types: [text]
        # Regex pattern matching emoji Unicode ranges
        entry_regex: '[\x{1F600}-\x{1F64F}\x{1F300}-\x{1F5FF}\x{1F680}-\x{1F6FF}\x{1F900}-\x{1F9FF}\x{2600}-\x{26FF}\x{2700}-\x{27BF}]'

  # 3. Optional: Block Emojis in Commit Messages
  - repo: local
    hooks:
      - id: block-emoji-commit-msg
        name: Block emojis in commit messages
        stages: [commit-msg]
        language: fail
        entry: 'Commit message contains emojis. Please use plain text.'
        entry_regex: '[\x{1F600}-\x{1F64F}\x{1F300}-\x{1F5FF}\x{1F680}-\x{1F6FF}\x{1F900}-\x{1F9FF}\x{2600}-\x{26FF}\x{2700}-\x{27BF}]'