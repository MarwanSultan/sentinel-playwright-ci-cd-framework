version: '3.8'

services:
  # Main test automation application
  test-automation:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: va-test-automation
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://testuser:testpass@postgres:5432/test_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./test-results:/app/test-results
      - ./logs:/app/logs
      - /app/node_modules
    networks:
      - test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.va.service=test-automation"
      - "com.va.version=1.0.0"

  # Development environment
  test-automation-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: va-test-automation-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DEBUG: ${DEBUG:-*}
      DATABASE_URL: ${DATABASE_URL:-postgresql://testuser:testpass@postgres:5432/test_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "3001:3000"
      - "9229:9229"  # Debug port
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - ./test-results:/app/test-results
    networks:
      - test-network
    profiles:
      - dev
    command: run dev

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: va-test-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-test_db}
      POSTGRES_USER: ${POSTGRES_USER:-testuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testpass}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: va-test-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Playwright Test Runner (for parallel test execution)
  playwright-runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: va-test-playwright
    environment:
      NODE_ENV: test
      BASE_URL: http://test-automation:3000
      DATABASE_URL: postgresql://testuser:testpass@postgres:5432/test_db
      PARALLEL_WORKERS: 4
    depends_on:
      test-automation:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./test-results:/app/test-results
      - ./logs:/app/logs
    networks:
      - test-network
    profiles:
      - test
    command: run test:e2e

  # API Mock Server (for mocking external APIs)
  mock-server:
    image: mockserver/mockserver:latest
    container_name: va-test-mock-api
    ports:
      - "1080:1080"
    environment:
      MOCKSERVER_PROPERTY_FILE: /config/mockserver-init.properties
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/initializerJson.json
    volumes:
      - ./config/mockserver:/config:ro
    networks:
      - test-network
    profiles:
      - test
    restart: unless-stopped

  # Nginx Reverse Proxy (for load balancing)
  nginx:
    image: nginx:alpine
    container_name: va-test-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl:/etc/nginx/ssl:ro
    depends_on:
      - test-automation
    networks:
      - test-network
    profiles:
      - production
    restart: unless-stopped

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: va-test-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - test-network
    profiles:
      - monitoring
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: va-test-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-worldmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - test-network
    profiles:
      - monitoring
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  test-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
